name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux
            args: ''
          - platform: windows-latest
            target: windows
            args: ''
          - platform: macos-latest
            target: macos
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lil Buddy ${{ github.ref_name }} Developer Preview'
          releaseBody: |
            Lil Buddy ${{ github.ref_name }} Developer Preview

            This is an experimental Developer Preview. Unsigned builds may show operating system warnings.
            Please review the privacy and security notes before connecting providers, Telegram, or workspaces.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/docs/CHANGELOG.md) for details.

            ### Verify checksums
            ```bash
            sha256sum -c SHA256SUMS
            ```
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
