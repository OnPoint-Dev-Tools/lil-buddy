name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Describe the feature
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Companion
        - Experts
        - Telegram gateway
        - Workspace
        - Themes
        - Provider integration
        - Packaging/signing
        - Other
